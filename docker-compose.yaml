services:
  db:
    image: postgres:18.1
    container_name: postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: test
      POSTGRES_DB: auto-repair-shop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "auto-repair-shop"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: auto-repair-shop-app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/auto-repair-shop
      DATABASE_USERNAME: app
      DATABASE_PASSWORD: test
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
