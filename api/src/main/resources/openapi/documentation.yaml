openapi: "3.1.0"
info:
  title: "Auto Repair Shop API"
  description: "API para gerenciamento de oficina mecânica - FIAP SOAT"
  version: "1.0.0"

servers:
  - url: "http://localhost:8080/v1"
    description: "Local development server"

tags:
  - name: Health
    description: "Health check da aplicação"
  - name: Order
    description: "Gerenciamento de ordens de serviço"
  - name: Customer
    description: "Gerenciamento de clientes"
  - name: Vehicle
    description: "Gerenciamento de veículos"

paths:
  # ==================== ORDERS ====================
  /orders:
    get:
      tags:
        - Order
      summary: "Listar ordens de serviço"
      description: "Retorna a lista paginada de todas as ordens de serviço"
      operationId: getAllOrders
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: "Número da página (padrão: 1)"
          schema:
            type: integer
            format: int32
            default: 1
            minimum: 1
      responses:
        "200":
          description: "Lista de ordens"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOrderResponseDTO"
        "401":
          description: "Não autorizado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Order
      summary: "Criar nova ordem de serviço"
      description: "Cria uma nova ordem de serviço para um cliente e veículo"
      operationId: createOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequestDTO"
      responses:
        "201":
          description: "Ordem criada com sucesso"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponseDTO"
        "401":
          description: "Não autorizado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}:
    get:
      tags:
        - Order
      summary: "Buscar ordem por ID"
      description: "Retorna os detalhes completos de uma ordem de serviço"
      operationId: getOrderById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "ID da ordem de serviço"
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Ordem encontrada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponseDTO"
        "401":
          description: "Não autorizado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Ordem não encontrada"

  /orders/{id}/status:
    get:
      tags:
        - Order
      summary: "Consultar status da ordem"
      description: "Endpoint público para cliente consultar status da ordem"
      operationId: getOrderStatus
      parameters:
        - name: id
          in: path
          required: true
          description: "ID da ordem de serviço"
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Status encontrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatusResponseDTO"
        "400":
          description: "ID inválido"
          content:
            application/json:
              schema:
                type: string
              examples:
                invalid:
                  value: "Invalid Order ID format"
        "404":
          description: "Ordem não encontrada"

  /orders/metrics:
    get:
      tags:
        - Order
      summary: "Obter métricas de ordens"
      description: "Retorna métricas consolidadas das ordens de serviço (total completadas e tempo médio de execução)"
      operationId: getOrderMetrics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Métricas obtidas com sucesso"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderMetricsResponseDTO"
        "401":
          description: "Não autorizado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/schedule-delivery:
    post:
      tags:
        - Order
      summary: "Agendar entrega do veículo"
      description: "Agenda a data/hora de entrega do veículo na oficina"
      operationId: scheduleDelivery
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "ID da ordem de serviço"
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderScheduleVehicleRequestDTO"
      responses:
        "200":
          description: "Entrega agendada com sucesso"
        "401":
          description: "Não autorizado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/schedule-return:
    post:
      tags:
        - Order
      summary: "Agendar devolução do veículo"
      description: "Agenda a data/hora de devolução do veículo ao cliente"
      operationId: scheduleReturn
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "ID da ordem de serviço"
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderScheduleVehicleRequestDTO"
      responses:
        "200":
          description: "Devolução agendada com sucesso"
        "401":
          description: "Não autorizado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/deliver:
    post:
      tags:
        - Order
      summary: "Entregar veículo ao cliente"
      description: "Marca a ordem de serviço como entregue ao cliente"
      operationId: deliverOrder
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "ID da ordem de serviço"
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Ordem marcada como entregue"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponseDTO"
        "401":
          description: "Não autorizado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Ordem não encontrada"

  # ==================== CUSTOMERS ====================
  /customers:
    get:
      tags:
        - Customer
      summary: "Listar todos os clientes"
      description: "Retorna a lista de todos os clientes cadastrados"
      operationId: getAllCustomers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Lista de clientes"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerResponseDTO"
        "401":
          description: "Não autorizado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Customer
      summary: "Cadastrar novo cliente"
      description: "Cria um novo cliente no sistema"
      operationId: createCustomer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequestDTO"
      responses:
        "201":
          description: "Cliente criado com sucesso"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponseDTO"
        "401":
          description: "Não autorizado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /customers/{id}:
    get:
      tags:
        - Customer
      summary: "Buscar cliente por ID"
      description: "Retorna os dados de um cliente específico"
      operationId: getCustomerById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "ID do cliente"
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Cliente encontrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponseDTO"
        "400":
          description: "ID inválido"
          content:
            application/json:
              schema:
                type: string
              examples:
                invalid:
                  value: "Invalid ID format"
        "401":
          description: "Não autorizado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Cliente não encontrado"

    put:
      tags:
        - Customer
      summary: "Atualizar cliente"
      description: "Atualiza os dados de um cliente existente"
      operationId: updateCustomer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "ID do cliente"
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequestDTO"
      responses:
        "200":
          description: "Cliente atualizado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponseDTO"
        "400":
          description: "ID inválido"
          content:
            application/json:
              schema:
                type: string
              examples:
                invalid:
                  value: "Invalid ID format"
        "401":
          description: "Não autorizado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Cliente não encontrado"

    delete:
      tags:
        - Customer
      summary: "Remover cliente"
      description: "Remove um cliente do sistema"
      operationId: deleteCustomer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "ID do cliente"
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Cliente removido com sucesso"
        "400":
          description: "ID inválido"
          content:
            application/json:
              schema:
                type: string
              examples:
                invalid:
                  value: "Invalid ID format"
        "401":
          description: "Não autorizado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Cliente não encontrado"

  # ==================== VEHICLES ====================
  /vehicles:
    get:
      tags:
        - Vehicle
      summary: "Listar todos os veículos"
      description: "Retorna a lista de todos os veículos cadastrados"
      operationId: getAllVehicles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Lista de veículos"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleResponseDTO"
        "401":
          description: "Não autorizado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Vehicle
      summary: "Cadastrar novo veículo"
      description: "Cria um novo veículo vinculado a um cliente"
      operationId: createVehicle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVehicleRequestDTO"
      responses:
        "201":
          description: "Veículo criado com sucesso"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleResponseDTO"
        "401":
          description: "Não autorizado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vehicles/{id}:
    get:
      tags:
        - Vehicle
      summary: "Buscar veículo por ID"
      description: "Retorna os dados de um veículo específico"
      operationId: getVehicleById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "ID do veículo"
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Veículo encontrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleResponseDTO"
        "400":
          description: "ID inválido"
          content:
            application/json:
              schema:
                type: string
              examples:
                invalid:
                  value: "Invalid ID format"
        "401":
          description: "Não autorizado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Veículo não encontrado"

    put:
      tags:
        - Vehicle
      summary: "Atualizar veículo"
      description: "Atualiza os dados de um veículo existente"
      operationId: updateVehicle
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "ID do veículo"
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVehicleRequestDTO"
      responses:
        "200":
          description: "Veículo atualizado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleResponseDTO"
        "400":
          description: "ID inválido"
          content:
            application/json:
              schema:
                type: string
              examples:
                invalid:
                  value: "Invalid ID format"
        "401":
          description: "Não autorizado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Veículo não encontrado"

    delete:
      tags:
        - Vehicle
      summary: "Remover veículo"
      description: "Remove um veículo do sistema"
      operationId: deleteVehicle
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "ID do veículo"
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Veículo removido com sucesso"
        "400":
          description: "ID inválido"
          content:
            application/json:
              schema:
                type: string
              examples:
                invalid:
                  value: "Invalid ID format"
        "401":
          description: "Não autorizado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Veículo não encontrado"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Autenticação via JWT Bearer Token.

        O token é emitido pelo Lambda Authorizer no API Gateway (repositório separado).
        O app decodifica as claims (`sub` → userId, `role`, `cpf` → document) sem re-validar a assinatura.

        **Formato do header:**
        ```
        Authorization: Bearer <jwt>
        ```

        **Roles disponíveis:**
        - `ADMIN`: Acesso total a todos os endpoints protegidos
        - `ATTENDANT`: Acesso a endpoints de ordens, clientes, veículos, serviços e insumos

  schemas:
    # ==================== ORDER DTOs ====================
    CreateOrderRequestDTO:
      type: object
      description: "Dados para abrir uma ordem de serviço. Quem abriu vem do JWT (claims sub e cpf), não do corpo. Os itens não vêm daqui: chegam do diagnóstico feito no execution."
      properties:
        customerId:
          type: string
          format: uuid
          description: "ID do cliente"
        vehicleId:
          type: string
          format: uuid
          description: "ID do veículo"
        description:
          type: string
          description: "Descrição do problema relatado"
          example: "Veículo com barulho no motor ao acelerar"
      required:
        - customerId
        - vehicleId
        - description

    OrderResponseDTO:
      type: object
      description: "Resposta completa de uma ordem de serviço"
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/OrderStatus"
        customer:
          $ref: "#/components/schemas/Customer"
        vehicle:
          $ref: "#/components/schemas/Vehicle"
        openedBy:
          $ref: "#/components/schemas/User"
        diagnosedBy:
          allOf:
            - $ref: "#/components/schemas/User"
          nullable: true
          description: "Mecânico que concluiu o diagnóstico. Nulo enquanto a OS está em RECEIVED."
        description:
          type: string
        services:
          type: array
          items:
            $ref: "#/components/schemas/QuotedService"
          description: "Serviços precificados pelo diagnóstico"
        supplies:
          type: array
          items:
            $ref: "#/components/schemas/QuotedSupply"
          description: "Insumos precificados pelo diagnóstico"
      required:
        - id
        - createdAt
        - status
        - customer
        - vehicle
        - openedBy
        - description
        - services
        - supplies

    OrderStatusResponseDTO:
      type: object
      description: "Status resumido da ordem (para consulta pública)"
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/OrderStatus"
        modifiedAt:
          type: string
          format: date-time
          description: "Última atualização da ordem"
      required:
        - id
        - status
        - modifiedAt

    OrderMetricsResponseDTO:
      type: object
      description: "Métricas consolidadas das ordens de serviço"
      properties:
        totalCompleted:
          type: integer
          format: int64
          description: "Total de ordens completadas"
          example: 150
        averageExecutionTimeSeconds:
          type: integer
          format: int64
          nullable: true
          description: "Tempo médio de execução em segundos (null se não houver ordens completadas)"
          example: 86400
      required:
        - totalCompleted

    PageOrderResponseDTO:
      type: object
      description: "Resposta paginada de ordens de serviço"
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/OrderResponseDTO"
          description: "Lista de ordens na página atual"
        page:
          type: integer
          format: int32
          description: "Número da página atual"
          example: 1
        size:
          type: integer
          format: int32
          description: "Quantidade de itens na página"
          example: 10
      required:
        - content
        - page
        - size

    OrderScheduleVehicleRequestDTO:
      type: object
      description: "Dados para agendamento de entrega/devolução do veículo"
      properties:
        dateTime:
          type: string
          format: date-time
          description: "Data e hora do agendamento (formato ISO 8601 UTC)"
          example: "2025-01-20T10:00:00Z"
      required:
        - dateTime

    OrderStatus:
      type: string
      description: "Status possíveis de uma ordem de serviço"
      enum:
        - RECEIVED
        - WAITING_APPROVAL
        - EXECUTION_ENQUEUED
        - IN_PROGRESS
        - COMPLETED
        - DELIVERED
        - CANCELED

    QuotedService:
      type: object
      description: "Serviço precificado pelo diagnóstico, snapshot sem vínculo com o catálogo do execution"
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price:
          type: number
          format: decimal
      required:
        - id
        - name
        - price

    QuotedSupply:
      type: object
      description: "Insumo precificado pelo diagnóstico, snapshot sem vínculo com o estoque do execution"
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        quantity:
          type: integer
          format: int32
        unitPrice:
          type: number
          format: decimal
      required:
        - id
        - name
        - quantity
        - unitPrice

    User:
      type: object
      description: "Identidade extraída do JWT. Não corresponde a nenhuma tabela deste serviço."
      properties:
        id:
          type: string
          format: uuid
          description: "Claim sub do JWT"
        document:
          type: string
          description: "Claim cpf do JWT, apenas dígitos"
      required:
        - id
        - document

    # ==================== CUSTOMER DTOs ====================
    CreateCustomerRequestDTO:
      type: object
      description: "Dados para cadastrar um cliente"
      properties:
        name:
          type: string
          description: "Nome completo do cliente"
          example: "Maria da Silva"
        document:
          type: string
          description: "CPF ou CNPJ do cliente"
          example: "123.456.789-00"
        email:
          type: string
          format: email
          description: "Email do cliente"
          example: "maria@email.com"
        contact:
          type: string
          description: "Telefone de contato"
          example: "(11) 99999-9999"
      required:
        - name
        - document
        - email
        - contact

    CustomerResponseDTO:
      type: object
      description: "Dados do cliente"
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        document:
          type: string
        email:
          type: string
        contact:
          type: string
      required:
        - id
        - name
        - document
        - email
        - contact

    # ==================== VEHICLE DTOs ====================
    CreateVehicleRequestDTO:
      type: object
      description: "Dados para cadastrar um veículo"
      properties:
        clientId:
          type: string
          format: uuid
          description: "ID do cliente proprietário"
        plate:
          type: string
          description: "Placa do veículo"
          example: "ABC-1234"
        brand:
          type: string
          description: "Marca do veículo"
          example: "Toyota"
        model:
          type: string
          description: "Modelo do veículo"
          example: "Corolla"
        year:
          type: integer
          format: int32
          description: "Ano do veículo"
          example: 2022
      required:
        - clientId
        - plate
        - brand
        - model
        - year

    VehicleResponseDTO:
      type: object
      description: "Dados do veículo"
      properties:
        id:
          type: string
          format: uuid
        plate:
          type: string
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
          format: int32
        clientId:
          type: string
          format: uuid
      required:
        - id
        - plate
        - brand
        - model
        - year
        - clientId

    # ==================== DOMAIN ENTITIES ====================
    Customer:
      type: object
      description: "Entidade Cliente completa"
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int32
          default: 0
        name:
          type: string
        document:
          type: string
        email:
          type: string
        contact:
          type: string
      required:
        - id
        - createdAt
        - modifiedAt
        - version
        - name
        - document
        - email
        - contact

    Vehicle:
      type: object
      description: "Entidade Veículo completa"
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int32
          default: 0
        clientId:
          type: string
          format: uuid
        plate:
          type: string
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
          format: int32
      required:
        - id
        - createdAt
        - modifiedAt
        - version
        - clientId
        - plate
        - brand
        - model
        - year

    # ==================== ERROR RESPONSE ====================
    ErrorResponse:
      type: object
      description: "Resposta de erro padrão"
      properties:
        message:
          type: string
          description: "Mensagem de erro"
          example: "Token is not valid or has expired"
        code:
          type: string
          description: "Código do erro"
          example: "UNAUTHORIZED"
