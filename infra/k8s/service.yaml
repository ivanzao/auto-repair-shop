apiVersion: v1
kind: Service
metadata:
  name: auto-repair-shop-service
  namespace: auto-repair-shop
  labels:
    app: auto-repair-shop
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: auto-repair-shop
