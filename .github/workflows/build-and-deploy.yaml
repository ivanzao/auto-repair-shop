name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  AWS_REGION: us-east-1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit Tests
        run: ./gradlew test

      - name: Integration Tests
        run: ./gradlew integrationTest

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    environment: production
    outputs:
      rds_endpoint: ${{ steps.tf-output.outputs.rds_endpoint }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure S3 bucket for TF state
        run: |
          aws s3api create-bucket --bucket auto-repair-shop-51e91ca1-9a1e-4494-b657-6d868a9118de-tfstate --region us-east-1 2>/dev/null || true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: infra/terraform
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform apply -auto-approve

      - name: Get Terraform outputs
        id: tf-output
        working-directory: infra/terraform
        run: |
          echo "rds_endpoint=$(terraform output -raw rds_endpoint)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build, terraform]
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name auto-repair-shop-cluster --region ${{ env.AWS_REGION }}

      - name: Create namespace
        run: kubectl apply -f infra/k8s/namespace.yaml

      - name: Create K8s secrets
        run: |
          kubectl create secret generic auto-repair-shop-secret \
            --namespace=auto-repair-shop \
            --from-literal="DATABASE_PASSWORD=${{ secrets.DB_PASSWORD }}" \
            --from-literal="SECURITY_JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            --from-literal="MAILERSEND_TOKEN=${{ secrets.MAILERSEND_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create GHCR pull secret
        run: |
          kubectl create secret docker-registry ghcr-credentials \
            --namespace=auto-repair-shop \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GHCR_PAT }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes
        run: kubectl apply -f infra/k8s/

      - name: Wait for LoadBalancer hostname
        id: lb
        run: |
          for i in $(seq 1 30); do
            HOSTNAME=$(kubectl get svc auto-repair-shop-service -n auto-repair-shop \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$HOSTNAME" ]; then
              echo "hostname=$HOSTNAME" >> "$GITHUB_OUTPUT"
              echo "LoadBalancer hostname: $HOSTNAME"
              exit 0
            fi
            echo "Attempt $i/30 - waiting for LB hostname..."
            sleep 10
          done
          echo "Failed to get LoadBalancer hostname"
          exit 1

      - name: Patch configmap with dynamic values
        run: |
          kubectl patch configmap auto-repair-shop-config \
            -n auto-repair-shop \
            --type merge \
            -p "{\"data\":{\"DATABASE_URL\":\"jdbc:postgresql://${{ needs.terraform.outputs.rds_endpoint }}/auto_repair_shop\",\"APPLICATION_URL\":\"http://${{ steps.lb.outputs.hostname }}:8080\"}}"

      - name: Update deployment image
        run: |
          kubectl set image deployment/auto-repair-shop \
            auto-repair-shop=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7} \
            -n auto-repair-shop

      - name: Wait for rollout
        run: kubectl rollout status deployment/auto-repair-shop -n auto-repair-shop --timeout=300s

      - name: Smoke test
        run: |
          ENDPOINT=${{ steps.lb.outputs.hostname }}
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${ENDPOINT}:8080/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed"
              exit 0
            fi
            echo "Attempt $i/10 - got status $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "Smoke test failed after 10 attempts"
          exit 1
