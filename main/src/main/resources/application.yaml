application:
  url: "${APPLICATION_URL:http://localhost:8080}"
  profile: "${APPLICATION_PROFILE:dev}"

server:
  port: "${SERVER_PORT:8080}"

database:
  driverClassName: org.postgresql.Driver
  url: "${DATABASE_URL:jdbc:postgresql://localhost:5432/auto-repair-shop}"
  username: "${DATABASE_USERNAME:app}"
  password: "${DATABASE_PASSWORD:test}"
  maximumPoolSize: "${DATABASE_MAX_POOL_SIZE:6}"

security:
  hash:
    cost: "${SECURITY_HASH_COST:10}"

sns:
  topic:
    arn: "${SNS_TOPIC_ARN}"

sqs:
  queue:
    url: "${SQS_QUEUE_URL}"

aws:
  region: "${AWS_REGION:us-east-1}"
  endpoint: "${AWS_ENDPOINT:}"
  accessKeyId: "${AWS_ACCESS_KEY_ID:}"
  secretAccessKey: "${AWS_SECRET_ACCESS_KEY:}"
