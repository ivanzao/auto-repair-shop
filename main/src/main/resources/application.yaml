application:
  url: http://localhost:8080
  profile: dev

server:
  port: 8080

database:
  driverClassName: org.postgresql.Driver
  url: jdbc:postgresql://localhost:5432/auto-repair-shop
  username: app
  password: test
  maximumPoolSize: 6

security:
  hash:
    cost: 10  # BCrypt cost factor (10-12 recommended for production)

sns:
  topic:
    # tópico de eventos do order (produz OrderCreated). Em runtime: SNS_TOPIC_ARN (SSM order-events-topic-arn)
    arn: "arn:aws:sns:us-east-1:000000000000:auto-repair-shop-order-events"

sqs:
  queue:
    # fila de eventos de entrada do order (consome billing/execution). Em runtime: SQS_QUEUE_URL (via SSM)
    url: "http://localhost:4566/000000000000/auto-repair-shop-order-saga"
